name: API checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - name: Start integration services
        run: |
          docker run --detach --name planit-mongodb --publish 127.0.0.1:27018:27018 mongo:7.0.45 --port 27018 --replSet planit-rs --bind_ip_all
          docker run --detach --name planit-mailpit --publish 127.0.0.1:1025:1025 --publish 127.0.0.1:8025:8025 axllent/mailpit:v1.31.6
      - name: Wait for integration services
        timeout-minutes: 3
        run: |
          for attempt in {1..30}; do
            for service in planit-mongodb planit-mailpit; do
              if [ "$(docker inspect --format '{{.State.Running}}' "$service")" != "true" ]; then
                echo "::error::$service exited before becoming ready"
                exit 1
              fi
            done
            if timeout 5s docker exec planit-mongodb mongosh --host 127.0.0.1 --port 27018 --quiet --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)' &&
               timeout 5s docker exec planit-mailpit /mailpit readyz; then
              exit 0
            fi
            sleep 2
          done
          echo "Integration services did not become ready"
          exit 1
      - name: Initialize transaction-capable MongoDB
        run: |
          docker exec planit-mongodb mongosh --host 127.0.0.1 --port 27018 --quiet --eval 'rs.initiate({_id:"planit-rs",members:[{_id:0,host:"127.0.0.1:27018"}]})'
          for attempt in {1..30}; do
            if timeout 5s docker exec planit-mongodb mongosh --host 127.0.0.1 --port 27018 --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - run: npm run test:integration
      - run: npm run test:queries
      - run: npm run test:admin
      - run: npm run test:bookings
      - run: npm run test:inventory
      - run: npm run test:payments
      - run: npm run test:mail
      - name: Service diagnostics
        if: failure()
        run: |
          docker ps --all
          docker logs planit-mongodb || true
          docker logs planit-mailpit || true
          for service in planit-mongodb planit-mailpit; do
            details=$(docker inspect --format '{{json .State}}' "$service" 2>&1)
            echo "::error title=$service state::$details"
          done
          details=$(timeout 15s docker exec planit-mongodb mongosh --host 127.0.0.1 --port 27018 --quiet --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)' 2>&1) || true
          details="${details//'%'/'%25'}"
          details="${details//$'\n'/'%0A'}"
          details="${details//$'\r'/'%0D'}"
          echo "::error title=MongoDB readiness::$details"
          details=$(docker logs --tail 10 planit-mongodb 2>&1)
          details="${details//'%'/'%25'}"
          details="${details//$'\n'/'%0A'}"
          details="${details//$'\r'/'%0D'}"
          echo "::error title=MongoDB startup::$details"
      - name: Stop integration services
        if: always()
        run: docker rm --force planit-mongodb planit-mailpit || true
